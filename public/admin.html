<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ホロドリ ボーダー着地予測＆Discord配信管理パネル</title>
  <!-- 共通予測・整形エンジン（サーバー側 src/index.js と単一ソース共有） -->
  <script src="/engine.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-panel: #131929;
      --bg-card: #1a2236;
      --border: rgba(255, 255, 255, 0.12);
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* ログイン画面 */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 70%);
    }
    .login-box {
      width: 100%;
      max-width: 380px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .login-box h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
    }
    .login-box p {
      margin: 0 0 22px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: #fff;
      font-size: 16px;
      margin-bottom: 14px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--accent); }

    /* ボタン共通 */
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #082f49; }
    .btn-primary:hover:not(:disabled) { background: #7dd3fc; }
    .btn-success { background: var(--success); color: #022c22; }
    .btn-success:hover:not(:disabled) { background: #34d399; }
    .btn-warning { background: var(--warning); color: #271502; }
    .btn-warning:hover:not(:disabled) { background: #fbbf24; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
    .btn-full { width: 100%; }

    /* メイン管理画面 */
    #appScreen { display: none; padding-bottom: 48px; }

    header.topbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 1440px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ステータスバー */
    .status-strip {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    .status-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      color: var(--text-sub);
    }
    .status-meta strong { color: var(--text-main); }

    /* コントロール＆グリッド */
    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }
    @media (max-width: 1024px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }
    .card-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      background: #0b0f19;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; line-height: 1.5; }

    /* 3ランク個別カード＆手動補正 */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 960px) {
      .tier-grid { grid-template-columns: 1fr; }
    }
    .tier-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tier-box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tier-title {
      font-size: 16px;
      font-weight: 800;
    }
    .tier-rank-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
    }
    .tier-pred-val {
      font-size: 24px;
      font-weight: 800;
      color: #fbbf24;
    }
    .tier-sub-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
    }
    .tier-sub-row span.val {
      color: var(--text-main);
      font-weight: 700;
    }
    .adj-control {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .adj-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .adj-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .adj-row input[type="number"] {
      width: 115px;
      padding: 6px 8px;
      font-size: 13px;
      text-align: right;
    }

    /* プレビューキャンバス */
    .preview-wrap {
      width: 100%;
      overflow-x: auto;
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    canvas#tripleCanvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    /* 配信コントロール */
    .broadcast-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    @media (max-width: 640px) {
      .broadcast-actions { grid-template-columns: 1fr; }
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-main);
      margin-top: 10px;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    /* トースト通知 */
    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #1e293b;
      color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.5);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      z-index: 100;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 0.2s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- 1. ログイン画面 -->
  <div id="loginScreen">
    <div class="login-box">
      <h1>ホロドリ ボーダー管理パネル</h1>
      <p>管理者パスワードを入力してください</p>
      <input type="password" id="passwordInput" placeholder="パスワード" autocomplete="current-password" />
      <button id="loginBtn" class="btn-primary btn-full">ログイン</button>
    </div>
  </div>

  <!-- 2. 管理ダッシュボード -->
  <div id="appScreen">
    <header class="topbar">
      <div class="topbar-title">
        <h1>ホロドリ ボーダー予測 ＆ Discord配信管理</h1>
        <span class="badge" id="subCountBadge">購読: - ch</span>
      </div>
      <div class="topbar-actions">
        <button id="fetchApiBtn" class="btn-primary">🔄 APIから最新データ取得</button>
        <button id="reloadAllBtn" class="btn-secondary">サーバー再同期</button>
        <button id="logoutBtn" class="btn-secondary">ログアウト</button>
      </div>
    </header>

    <div class="container">
      <!-- ステータスバー -->
      <div class="status-strip">
        <div id="statusMessage" style="font-weight:700; color: var(--accent);">準備完了</div>
        <div class="status-meta">
          <span>自動API更新: <strong id="lastAutoFetchLabel">-</strong></span>
          <span>手動更新: <strong id="lastManualUpdateLabel">-</strong></span>
          <span>キャッシュ時刻: <strong id="cacheTimeLabel">-</strong></span>
        </div>
      </div>

      <!-- イベント選択 ＆ 3ランク予測・手動補正 -->
      <div class="card">
        <div class="card-header">
          <h2>📊 対象イベント・チャプター選択 ＆ 着地予測モデル</h2>
          <div style="display:flex; gap:8px;">
            <button id="saveAdjBtn" class="btn-secondary">補正値を保存</button>
            <button id="resetAdjBtn" class="btn-secondary">補正リセット</button>
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label class="field-label" for="eventSelect">表示・配信するイベント / チャプター</label>
          <select id="eventSelect"></select>
        </div>

        <div class="tier-grid" id="tierCardsContainer"></div>
      </div>

      <!-- プレビュー画像 ＆ Discord一斉配信パネル -->
      <div class="grid-2">
        <!-- 左：トリプル比較画像プレビュー -->
        <div class="card">
          <div class="card-header">
            <h2>🖼️ Discord配信用 予測画像プレビュー (2160×820)</h2>
            <button id="downloadImgBtn" class="btn-secondary">画像を保存</button>
          </div>
          <div class="preview-wrap">
            <canvas id="tripleCanvas" width="2160" height="820"></canvas>
          </div>
        </div>

        <!-- 右：テキスト編集 ＆ 一斉配信・キャッシュ更新 -->
        <div class="card">
          <div class="card-header">
            <h2>📣 Discord 一斉通知 ＆ キャッシュ更新</h2>
            <button id="copyTextBtn" class="btn-secondary">テキストコピー</button>
          </div>

          <div style="margin-bottom: 12px;">
            <label class="field-label" for="nowBorderTextarea">現在ボーダー本文（/nowborder・/border・定時通知共通）</label>
            <textarea id="nowBorderTextarea" rows="5"></textarea>
          </div>

          <div style="margin-bottom: 12px;">
            <label class="field-label" for="customTextInput">追加メッセージ（任意・一斉通知時のみ添付）</label>
            <textarea id="customTextInput" rows="3" placeholder="例：終盤スパートに入りました！ラスト3時間は30分ごとに通知します。"></textarea>
          </div>

          <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;">
            <div style="min-width: 180px;">
              <label class="field-label" for="customPosSelect">追加メッセージの配置</label>
              <select id="customPosSelect">
                <option value="below">画像・本文の下に送信</option>
                <option value="above">本文の上に連結して送信</option>
              </select>
            </div>

            <label class="checkbox-row">
              <input type="checkbox" id="respectMuteCheck" checked />
              <span>サーバー別の通知ミュート時間帯を尊重する</span>
            </label>
          </div>

          <div class="broadcast-actions">
            <button id="updateCacheOnlyBtn" class="btn-warning">💾 キャッシュのみ更新（通知なし）</button>
            <button id="broadcastBtn" class="btn-success">🚀 キャッシュ更新 ＋ Discord一斉通知</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    (() => {
      // 共通エンジン（public/engine.js）
      const Engine = window.HolodoriEngine;
      const { TIER_DEFS } = Engine;
      const GITHUB_ARCHIVE_BASE = "https://raw.githubusercontent.com/holodori-tools/event-borders/main/archive";

      // アプリケーション状態
      const state = {
        password: sessionStorage.getItem("holodori_admin_pw") || "",
        events: [],
        graphs: {},
        archiveItems: [],
        archiveGraphs: {},
        manualAdjustments: {},
        guildSettings: {},
        subscriptionCount: 0,
        lastManualUpdateAt: 0,
        lastAutoFetchAt: 0,
        nowBorderCache: null,
        predictionCacheMeta: null,
        allTargets: [],
        selectedKey: "",
        predsByRank: {},
        textManuallyEdited: false,
      };

      // DOM要素
      const el = {
        loginScreen: document.getElementById("loginScreen"),
        appScreen: document.getElementById("appScreen"),
        passwordInput: document.getElementById("passwordInput"),
        loginBtn: document.getElementById("loginBtn"),
        logoutBtn: document.getElementById("logoutBtn"),
        fetchApiBtn: document.getElementById("fetchApiBtn"),
        reloadAllBtn: document.getElementById("reloadAllBtn"),
        subCountBadge: document.getElementById("subCountBadge"),
        statusMessage: document.getElementById("statusMessage"),
        lastAutoFetchLabel: document.getElementById("lastAutoFetchLabel"),
        lastManualUpdateLabel: document.getElementById("lastManualUpdateLabel"),
        cacheTimeLabel: document.getElementById("cacheTimeLabel"),
        eventSelect: document.getElementById("eventSelect"),
        tierCardsContainer: document.getElementById("tierCardsContainer"),
        saveAdjBtn: document.getElementById("saveAdjBtn"),
        resetAdjBtn: document.getElementById("resetAdjBtn"),
        tripleCanvas: document.getElementById("tripleCanvas"),
        downloadImgBtn: document.getElementById("downloadImgBtn"),
        nowBorderTextarea: document.getElementById("nowBorderTextarea"),
        copyTextBtn: document.getElementById("copyTextBtn"),
        customTextInput: document.getElementById("customTextInput"),
        customPosSelect: document.getElementById("customPosSelect"),
        respectMuteCheck: document.getElementById("respectMuteCheck"),
        updateCacheOnlyBtn: document.getElementById("updateCacheOnlyBtn"),
        broadcastBtn: document.getElementById("broadcastBtn"),
        toast: document.getElementById("toast"),
      };

      let toastTimer = null;
      function showToast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove("show"), 3400);
      }

      function setStatus(msg, color = "var(--accent)") {
        el.statusMessage.textContent = msg;
        el.statusMessage.style.color = color;
      }

      async function apiFetch(url, options = {}) {
        const headers = {
          ...(options.headers || {}),
          "x-admin-password": state.password,
        };
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401) {
          sessionStorage.removeItem("holodori_admin_pw");
          state.password = "";
          el.appScreen.style.display = "none";
          el.loginScreen.style.display = "flex";
          throw new Error("認証エラー：再ログインしてください。");
        }
        return res;
      }

      // -----------------------------------------------------------------------
      // GitHub過去アーカイブ読込
      // -----------------------------------------------------------------------
      async function loadArchiveFromGithub() {
        try {
          const res = await fetch(`${GITHUB_ARCHIVE_BASE}/index.json?t=${Math.floor(Date.now() / 60000)}`, {
            cache: "no-store",
          });
          if (!res.ok) return;
          const manifest = await res.json();
          const entries = Array.isArray(manifest) ? manifest : Array.isArray(manifest.items) ? manifest.items : [];

          const items = [];
          const graphs = {};

          for (const ent of entries) {
            const tierEntries = [];
            for (const [k, val] of Object.entries(ent)) {
              const m = /^t(\d+)$/i.exec(k);
              if (m && typeof val === "string" && val.trim() !== "") {
                tierEntries.push({ rankHint: Number(m[1]), file: val.trim() });
              }
            }
            if (tierEntries.length === 0 && typeof ent.file === "string") {
              tierEntries.push({ rankHint: ent.rank || 5000, file: ent.file.trim() });
            }

            const displayName = ent.tag || ent.name || ent.chapterId || ent.eventId || "archive";
            const key = ent.eventId && ent.chapterId ? `${ent.eventId}::${ent.chapterId}` : `archive::${displayName}`;

            const fetched = await Promise.all(
              tierEntries.map(async (te) => {
                try {
                  const gRes = await fetch(`${GITHUB_ARCHIVE_BASE}/${te.file}`);
                  if (!gRes.ok) return null;
                  const graph = await gRes.json();
                  if (!graph || !Array.isArray(graph.tier) || graph.tier.length === 0) return null;
                  return { actualRank: Number(graph.rank) || te.rankHint, graph };
                } catch (_) {
                  return null;
                }
              })
            );

            let repGraph = null;
            for (const item of fetched) {
              if (!item) continue;
              graphs[`${key}::${item.actualRank}`] = item.graph;
              if (!repGraph) repGraph = item.graph;
            }

            if (repGraph) {
              const durH = (repGraph.endTime - repGraph.startTime) / 3600000;
              const cat = ent.category || "spotlight";
              items.push({
                key,
                eventId: ent.eventId || "archive",
                chapterId: ent.chapterId || displayName,
                category: cat,
                catLabel: cat === "point" ? "ポイントイベント" : "スポットライト",
                eventName: displayName,
                chapterName: null,
                shortLabel: displayName,
                startTime: repGraph.startTime,
                endTime: repGraph.endTime,
                durationH: durH,
                live: false,
                isArchive: true,
              });
            }
          }

          state.archiveItems = items;
          state.archiveGraphs = graphs;
        } catch (err) {
          console.warn("[Archive] 読込エラー:", err);
        }
      }

      // -----------------------------------------------------------------------
      // イベント＆チャプター一覧構築
      // -----------------------------------------------------------------------
      function buildTargetList() {
        const list = [];
        const seen = new Set();

        // 1. Redis上の最新・開催中イベント群
        for (const ev of state.events) {
          if (!ev || !ev.eventId || ev.isSongScore) continue;
          const isRelay = Number(ev.type) === 2 || (Array.isArray(ev.chapters) && ev.chapters.length > 1);
          const category = isRelay ? "spotlight" : "point";
          const catLabel = isRelay ? "スポットライト" : "ポイントイベント";

          if (Array.isArray(ev.chapters) && ev.chapters.length > 0) {
            for (const chId of ev.chapters) {
              const key = `${ev.eventId}::${chId}`;
              if (seen.has(key)) continue;
              const meta = ev.chapterMeta?.[chId] || {};
              const repGraph =
                state.graphs[`${key}::5000`] ||
                state.graphs[`${key}::1000`] ||
                state.graphs[`${key}::10000`];
              const st = meta.startTime || repGraph?.startTime || ev.startTime;
              const et = meta.endTime || repGraph?.endTime || ev.endTime;
              if (!st || !et) continue;

              const now = Date.now();
              const live = now >= st && now <= et;
              const chName = meta.name || null;
              const shortCh = meta.shortName || chId;

              seen.add(key);
              list.push({
                key,
                eventId: ev.eventId,
                chapterId: chId,
                category,
                catLabel,
                eventName: ev.name || ev.eventId,
                chapterName: chName,
                shortLabel: chName ? `${ev.name} / ${shortCh}` : ev.name || ev.eventId,
                startTime: st,
                endTime: et,
                durationH: (et - st) / 3600000,
                live,
                hasGraphs: Boolean(repGraph),
              });
            }
          } else {
            // チャプター配列がない場合、graphsのキーから探索
            const prefixCandidates = new Set();
            for (const gKey of Object.keys(state.graphs)) {
              if (gKey.startsWith(`${ev.eventId}::`)) {
                prefixCandidates.add(gKey.replace(/::\d+$/, ""));
              }
            }
            if (prefixCandidates.size === 0 && ev.startTime && ev.endTime) {
              prefixCandidates.add(`${ev.eventId}::default`);
            }
            for (const key of prefixCandidates) {
              if (seen.has(key)) continue;
              const repGraph =
                state.graphs[`${key}::5000`] ||
                state.graphs[`${key}::1000`] ||
                state.graphs[`${key}::10000`];
              const st = repGraph?.startTime || ev.startTime;
              const et = repGraph?.endTime || ev.endTime;
              if (!st || !et) continue;

              const now = Date.now();
              seen.add(key);
              list.push({
                key,
                eventId: ev.eventId,
                chapterId: key.split("::")[1] || "default",
                category,
                catLabel,
                eventName: ev.name || ev.eventId,
                chapterName: null,
                shortLabel: ev.name || ev.eventId,
                startTime: st,
                endTime: et,
                durationH: (et - st) / 3600000,
                live: now >= st && now <= et,
                hasGraphs: Boolean(repGraph),
              });
            }
          }
        }

        // 2. graphs にのみ存在するキー補完
        const graphPrefixes = new Set(Object.keys(state.graphs).map((k) => k.replace(/::\d+$/, "")));
        for (const key of graphPrefixes) {
          if (seen.has(key)) continue;
          const repGraph =
            state.graphs[`${key}::5000`] ||
            state.graphs[`${key}::1000`] ||
            state.graphs[`${key}::10000`];
          if (!repGraph) continue;
          const durH = (repGraph.endTime - repGraph.startTime) / 3600000;
          const isSpot = durH <= 80;
          seen.add(key);
          list.push({
            key,
            eventId: repGraph.eventId || key.split("::")[0],
            chapterId: repGraph.chapterId || key.split("::")[1] || "default",
            category: isSpot ? "spotlight" : "point",
            catLabel: isSpot ? "スポットライト" : "ポイントイベント",
            eventName: repGraph.eventId || key,
            chapterName: null,
            shortLabel: key,
            startTime: repGraph.startTime,
            endTime: repGraph.endTime,
            durationH: durH,
            live: Date.now() >= repGraph.startTime && Date.now() <= repGraph.endTime,
            hasGraphs: true,
          });
        }

        // 3. 過去アーカイブ補完
        for (const aItem of state.archiveItems) {
          if (seen.has(aItem.key)) continue;
          seen.add(aItem.key);
          list.push({ ...aItem, hasGraphs: true });
        }

        // ソート：開催中 > グラフデータ有り新しい順 > 開始日時新しい順
        list.sort((a, b) => {
          if (a.live !== b.live) return a.live ? -1 : 1;
          if (Boolean(a.hasGraphs) !== Boolean(b.hasGraphs)) return a.hasGraphs ? -1 : 1;
          return (b.startTime || 0) - (a.startTime || 0);
        });

        state.allTargets = list;

        // プルダウン描画
        el.eventSelect.innerHTML = "";
        for (const item of list) {
          const opt = document.createElement("option");
          opt.value = item.key;
          const statusTag = item.live ? "🔴開催中" : item.isArchive ? "📦過去アーカイブ" : "⚪終了";
          opt.textContent = `[${statusTag}] ${item.shortLabel} (${Engine.formatJST(item.startTime, true)}〜)`;
          el.eventSelect.appendChild(opt);
        }

        if (!state.selectedKey || !list.some((i) => i.key === state.selectedKey)) {
          state.selectedKey = list[0]?.key || "";
        }
        el.eventSelect.value = state.selectedKey;
      }

      // -----------------------------------------------------------------------
      // 予測計算（Engine.computePrediction を使用）＆ UI・Canvas更新
      // -----------------------------------------------------------------------
      function recalculateAndRender() {
        const target = state.allTargets.find((t) => t.key === state.selectedKey);
        if (!target) return;

        const predsByRank = {};
        const graphsByRank = {};
        const adjMap = state.manualAdjustments[target.key] || {};

        for (const tierDef of TIER_DEFS) {
          const gKey = `${target.key}::${tierDef.rank}`;
          const targetGraph = state.graphs[gKey] || state.archiveGraphs[gKey] || null;
          graphsByRank[tierDef.rank] = targetGraph;

          if (!targetGraph || !Array.isArray(targetGraph.tier) || targetGraph.tier.length === 0) {
            predsByRank[tierDef.rank] = null;
            continue;
          }

          // 参照過去データ収集
          const refPairs = [];
          for (const aItem of state.archiveItems) {
            if (aItem.key === target.key || aItem.category !== target.category) continue;
            const g = state.archiveGraphs[`${aItem.key}::${tierDef.rank}`];
            if (g) refPairs.push({ item: aItem, graph: g });
          }
          for (const [k, gVal] of Object.entries(state.graphs)) {
            if (!k.endsWith(`::${tierDef.rank}`) || k.startsWith(`${target.key}::`)) continue;
            if (!gVal || !Array.isArray(gVal.tier) || gVal.tier.length < 15) continue;
            const gProg =
              (gVal.tier[gVal.tier.length - 1][0] - gVal.startTime) /
              Math.max(1, gVal.endTime - gVal.startTime);
            if (gProg < 0.98) continue;
            const prefix = k.replace(/::\d+$/, "");
            refPairs.push({
              item: {
                key: prefix,
                eventId: gVal.eventId || prefix,
                chapterId: gVal.chapterId || prefix,
                category: target.category,
                durationH: (gVal.endTime - gVal.startTime) / 3600000,
                live: false,
              },
              graph: gVal,
            });
          }

          predsByRank[tierDef.rank] = Engine.computePrediction(
            target,
            targetGraph,
            refPairs,
            tierDef.rank,
            Number(adjMap[tierDef.rank]) || 0
          );
        }

        state.predsByRank = predsByRank;

        // 3ランクカードUI更新
        renderTierCards(target, predsByRank);

        // NowBorderテキスト自動生成（手動編集中でなければ反映）
        if (!state.textManuallyEdited) {
          const built = Engine.buildNowBorderText(graphsByRank);
          if (built) {
            el.nowBorderTextarea.value = built.text;
          } else if (state.nowBorderCache?.text) {
            el.nowBorderTextarea.value = state.nowBorderCache.text;
          } else {
            el.nowBorderTextarea.value = "";
          }
        }

        // トリプルCanvas描画
        renderTripleCanvas(target, predsByRank);
      }

      function renderTierCards(target, predsByRank) {
        el.tierCardsContainer.innerHTML = "";
        const adjMap = state.manualAdjustments[target.key] || {};

        for (const tierDef of TIER_DEFS) {
          const pred = predsByRank[tierDef.rank];
          const theme = Engine.getTierTheme(tierDef.rank);
          const curAdj = Number(adjMap[tierDef.rank]) || 0;

          const box = document.createElement("div");
          box.className = "tier-box";
          box.style.borderColor = theme.borderStops[0];

          if (!pred) {
            box.innerHTML = `
              <div class="tier-box-top">
                <span class="tier-title" style="color:${theme.primary}">${tierDef.label}</span>
                <span class="tier-rank-pill">T${tierDef.rank.toLocaleString()}</span>
              </div>
              <div style="color:var(--text-sub); font-size:13px; padding:18px 0;">データ未取得</div>
            `;
            el.tierCardsContainer.appendChild(box);
            continue;
          }

          box.innerHTML = `
            <div class="tier-box-top">
              <span class="tier-title" style="color:${theme.primary}">${tierDef.label}</span>
              <span class="tier-rank-pill">T${tierDef.rank.toLocaleString()}</span>
            </div>
            <div class="tier-pred-val" style="color:${theme.forecast}">
              ${Engine.formatNumber(pred.centralFinal)} pt
            </div>
            <div class="tier-sub-row">
              <span>現在スコア</span>
              <span class="val">${Engine.formatNumber(pred.currentScore)} pt</span>
            </div>
            <div class="tier-sub-row">
              <span>予測レンジ</span>
              <span class="val">${Engine.formatNumber(pred.minFinal)} 〜 ${Engine.formatNumber(pred.maxFinal)}</span>
            </div>
            <div class="tier-sub-row">
              <span>直近時速 / 類似度</span>
              <span class="val">${Engine.formatNumber(pred.recentPace)} pt/h (${Math.round((pred.metaInfo?.topShapeSim || 0) * 100)}%)</span>
            </div>
            <div class="adj-control">
              <div class="tier-sub-row">
                <span>手動着地補正 (pt)</span>
                <span class="val" style="color:${curAdj !== 0 ? "#38bdf8" : "var(--text-sub)"}">
                  ${curAdj > 0 ? "+" : ""}${Engine.formatNumber(curAdj)} pt
                </span>
              </div>
              <div class="adj-row">
                <input type="range" min="-500000" max="500000" step="5000" value="${curAdj}" data-rank="${tierDef.rank}" class="adj-slider" />
                <input type="number" step="5000" value="${curAdj}" data-rank="${tierDef.rank}" class="adj-num" />
              </div>
            </div>
          `;
          el.tierCardsContainer.appendChild(box);
        }

        // 補正スライダー＆数値入力イベント
        el.tierCardsContainer.querySelectorAll(".adj-slider, .adj-num").forEach((inp) => {
          inp.addEventListener("input", (e) => {
            const r = e.target.dataset.rank;
            const val = Number(e.target.value) || 0;
            if (!state.manualAdjustments[target.key]) state.manualAdjustments[target.key] = {};
            state.manualAdjustments[target.key][r] = val;
            recalculateAndRender();
          });
        });
      }

      // -----------------------------------------------------------------------
      // トリプル比較 Canvas 描画（サーバー側と完全同一レイアウト・共通テーマ）
      // -----------------------------------------------------------------------
      function drawRoundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawFittedText(ctx, text, x, y, maxWidth) {
        let str = String(text || "");
        if (ctx.measureText(str).width <= maxWidth) {
          ctx.fillText(str, x, y);
          return;
        }
        while (str.length > 1 && ctx.measureText(str + "…").width > maxWidth) {
          str = str.slice(0, -1);
        }
        ctx.fillText(str + "…", x, y);
      }

      function renderTripleCanvas(targetItem, predsByRank) {
        const canvas = el.tripleCanvas;
        const ctx = canvas.getContext("2d");
        const W = 2160;
        const H = 820;
        const fontFam = '"Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif';

        const baseBg = ctx.createLinearGradient(0, 0, W, H);
        baseBg.addColorStop(0, "#090c15");
        baseBg.addColorStop(0.5, "#111626");
        baseBg.addColorStop(1, "#090c15");
        ctx.fillStyle = baseBg;
        ctx.fillRect(0, 0, W, H);

        const marginX = 32;
        const gapX = 24;
        const topBarY = 22;
        const topBarH = 88;

        ctx.save();
        drawRoundRect(ctx, marginX, topBarY, W - marginX * 2, topBarH, 14);
        ctx.fillStyle = "rgba(255, 255, 255, 0.05)";
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
        ctx.stroke();
        ctx.restore();

        ctx.save();
        drawRoundRect(ctx, marginX + 16, topBarY + 16, 6, topBarH - 32, 3);
        ctx.fillStyle = "#38bdf8";
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
        ctx.font = `600 16px ${fontFam}`;
        ctx.fillText(
          `${targetItem.catLabel}  ｜  開催期間: ${Engine.formatJST(targetItem.startTime)} 〜 ${Engine.formatJST(targetItem.endTime)}`,
          marginX + 36,
          topBarY + 32
        );

        const fullTitle = targetItem.chapterName
          ? `${targetItem.eventName}  ／  ${targetItem.chapterName}`
          : targetItem.eventName;

        ctx.fillStyle = "#ffffff";
        ctx.font = `800 32px ${fontFam}`;
        drawFittedText(ctx, fullTitle, marginX + 36, topBarY + 72, W - marginX * 2 - 420);

        ctx.fillStyle = "rgba(255, 255, 255, 0.72)";
        ctx.font = `700 16px ${fontFam}`;
        ctx.textAlign = "right";
        ctx.fillText("BORDER FORECAST OVERVIEW", W - marginX - 22, topBarY + 34);

        ctx.fillStyle = "rgba(255, 255, 255, 0.52)";
        ctx.font = `600 15px ${fontFam}`;
        ctx.fillText(`Generated at ${Engine.formatJST(Date.now())} JST`, W - marginX - 22, topBarY + 68);
        ctx.textAlign = "left";

        const cardY = topBarY + topBarH + 18;
        const cardH = H - cardY - 24;
        const cardW = (W - marginX * 2 - gapX * 2) / 3;

        TIER_DEFS.forEach((tierDef, idx) => {
          const cx = marginX + idx * (cardW + gapX);
          const pred = predsByRank[tierDef.rank] || null;
          drawComparisonSlot(ctx, cx, cardY, cardW, cardH, pred, tierDef.rank, fontFam);
        });
      }

      function drawComparisonSlot(ctx, x, y, w, h, pred, rank, fontFam) {
        const theme = Engine.getTierTheme(rank);
        const rankTitle = Engine.getTierRankTitle(rank);

        ctx.save();
        drawRoundRect(ctx, x, y, w, h, 18);
        const cardBg = ctx.createLinearGradient(x, y, x + w, y + h);
        cardBg.addColorStop(0, theme.bgStops[0]);
        cardBg.addColorStop(0.5, theme.bgStops[1]);
        cardBg.addColorStop(1, theme.bgStops[2]);
        ctx.fillStyle = cardBg;
        ctx.fill();

        const aura = ctx.createRadialGradient(x + w * 0.8, y + 80, 15, x + w * 0.8, y + 80, 320);
        aura.addColorStop(0, theme.glowColor);
        aura.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = aura;
        ctx.fillRect(x, y, w, h);

        if (theme.rainbow) {
          const rbAura = ctx.createLinearGradient(x, y, x + w, y + h);
          rbAura.addColorStop(0, "rgba(255, 77, 109, 0.14)");
          rbAura.addColorStop(0.35, "rgba(255, 183, 3, 0.12)");
          rbAura.addColorStop(0.7, "rgba(6, 214, 160, 0.12)");
          rbAura.addColorStop(1, "rgba(58, 134, 255, 0.16)");
          ctx.fillStyle = rbAura;
          ctx.fillRect(x, y, w, h);
        }
        ctx.restore();

        if (theme.sparkle) {
          const relStars = [
            [44, 46, 2.8], [w - 50, 40, 3.2], [w - 100, 125, 2.5],
            [w - 44, h - 46, 2.8], [52, h - 42, 2.3], [w * 0.55, 32, 2.2],
          ];
          for (const [sx, sy, sr] of relStars) {
            ctx.save();
            ctx.fillStyle = "#ffffff";
            ctx.shadowColor = theme.forecast;
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(x + sx, y + sy, sr, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        const borderGrad = ctx.createLinearGradient(x, y, x + w, y + h);
        theme.borderStops.forEach((c, idx) => {
          borderGrad.addColorStop(idx / Math.max(1, theme.borderStops.length - 1), c);
        });
        ctx.save();
        drawRoundRect(ctx, x, y, w, h, 18);
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = borderGrad;
        if (theme.sparkle) {
          ctx.shadowColor = theme.glowColor;
          ctx.shadowBlur = 20;
        }
        ctx.stroke();
        ctx.restore();

        const pad = 26;

        ctx.save();
        ctx.font = `800 30px ${fontFam}`;
        ctx.fillStyle = theme.primary;
        if (theme.sparkle) {
          ctx.shadowColor = theme.glowColor;
          ctx.shadowBlur = 14;
        }
        ctx.fillText(rankTitle || `T${rank.toLocaleString()} ボーダー`, x + pad, y + 54);
        ctx.restore();

        const badgeW = 136;
        const badgeH = 40;
        const badgeX = x + w - pad - badgeW;
        const badgeY = y + 23;

        ctx.save();
        drawRoundRect(ctx, badgeX, badgeY, badgeW, badgeH, 10);
        ctx.fillStyle = "rgba(255, 255, 255, 0.11)";
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = borderGrad;
        ctx.stroke();
        ctx.fillStyle = theme.primary;
        ctx.font = `800 20px ${fontFam}`;
        ctx.textAlign = "center";
        ctx.fillText(`T${rank.toLocaleString()}`, badgeX + badgeW / 2, badgeY + 27);
        ctx.restore();

        if (!pred) {
          ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
          ctx.font = `600 17px ${fontFam}`;
          ctx.fillText("データがまだ取得されていません。", x + pad, y + 120);
          return;
        }

        const heroX = x + pad;
        const heroY = y + 78;
        const heroW = w - pad * 2;
        const heroH = 122;
        ctx.save();
        drawRoundRect(ctx, heroX, heroY, heroW, heroH, 12);
        ctx.fillStyle = "rgba(0, 0, 0, 0.36)";
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "rgba(255, 255, 255, 0.74)";
        ctx.font = `700 15px ${fontFam}`;
        ctx.fillText(pred.isFinished ? "最終確定ボーダー" : "最終着地予測ボーダー（本命）", heroX + 18, heroY + 28);

        ctx.save();
        ctx.font = `800 44px ${fontFam}`;
        if (theme.rainbow) {
          const txtGrad = ctx.createLinearGradient(heroX + 18, 0, heroX + 380, 0);
          txtGrad.addColorStop(0, "#ff758f");
          txtGrad.addColorStop(0.35, "#ffd166");
          txtGrad.addColorStop(0.7, "#06d6a0");
          txtGrad.addColorStop(1, "#60a5fa");
          ctx.fillStyle = txtGrad;
        } else {
          ctx.fillStyle = theme.forecast;
        }
        if (theme.sparkle) {
          ctx.shadowColor = theme.glowColor;
          ctx.shadowBlur = 16;
        }
        ctx.fillText(`${Engine.formatNumber(pred.centralFinal)} pt`, heroX + 18, heroY + 76);
        ctx.restore();

        if (!pred.isFinished) {
          ctx.fillStyle = theme.accent;
          ctx.font = `700 16px ${fontFam}`;
          ctx.fillText(
            `誤差目安: ±${Engine.formatNumber(pred.halfSpread)} pt  (${Engine.formatNumber(pred.minFinal)} 〜 ${Engine.formatNumber(pred.maxFinal)})`,
            heroX + 18,
            heroY + 106
          );
        } else {
          ctx.fillStyle = theme.accent;
          ctx.font = `700 16px ${fontFam}`;
          ctx.fillText("イベント終了・確定スコア", heroX + 18, heroY + 106);
        }

        const gridY = heroY + heroH + 14;
        const colW = (w - pad * 2 - 14) / 2;
        const cellH = 44;
        const subCells = [
          { k: "現在スコア", v: `${Engine.formatNumber(pred.currentScore)} pt`, cx: x + pad, cy: gridY },
          {
            k: "経過 / 進捗",
            v: `${pred.elapsedH.toFixed(1)}h / ${pred.totalH.toFixed(0)}h (${(pred.pCur * 100).toFixed(1)}%)`,
            cx: x + pad + colW + 14,
            cy: gridY,
          },
          { k: "直近時速", v: `${Engine.formatNumber(pred.recentPace)} pt/h`, cx: x + pad, cy: gridY + cellH + 8 },
          {
            k: "残り予測増分",
            v: pred.isFinished ? "0 pt" : `+${Engine.formatNumber(Math.max(0, pred.centralFinal - pred.currentScore))} pt`,
            cx: x + pad + colW + 14,
            cy: gridY + cellH + 8,
          },
        ];

        for (const cell of subCells) {
          ctx.save();
          drawRoundRect(ctx, cell.cx, cell.cy, colW, cellH, 8);
          ctx.fillStyle = "rgba(255, 255, 255, 0.06)";
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = "rgba(255, 255, 255, 0.64)";
          ctx.font = `600 14px ${fontFam}`;
          ctx.fillText(cell.k, cell.cx + 12, cell.cy + 27);

          ctx.fillStyle = "#ffffff";
          ctx.font = `700 15px ${fontFam}`;
          ctx.textAlign = "right";
          ctx.fillText(cell.v, cell.cx + colW - 12, cell.cy + 27);
          ctx.textAlign = "left";
        }

        const topSplitY = gridY + cellH * 2 + 20;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + pad, topSplitY);
        ctx.lineTo(x + w - pad, topSplitY);
        ctx.stroke();

        const gBoxX = x + pad;
        const gBoxY = topSplitY + 10;
        const gBoxW = w - pad * 2;
        const gBoxH = y + h - 20 - gBoxY;

        ctx.save();
        drawRoundRect(ctx, gBoxX, gBoxY, gBoxW, gBoxH, 12);
        ctx.fillStyle = "rgba(0, 0, 0, 0.36)";
        ctx.fill();
        ctx.lineWidth = 1.2;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.font = `700 15px ${fontFam}`;
        ctx.fillText("推移実績 & 着地予測レンジ", gBoxX + 16, gBoxY + 26);

        ctx.fillStyle = "rgba(255, 255, 255, 0.58)";
        ctx.font = `600 13px ${fontFam}`;
        ctx.textAlign = "right";
        ctx.fillText(`基準: ${Engine.formatJST(pred.lastT)}`, gBoxX + gBoxW - 16, gBoxY + 26);
        ctx.textAlign = "left";

        const gPadL = 68, gPadR = 18, gPadT = 40, gPadB = 32;
        const plotX = gBoxX + gPadL;
        const plotY = gBoxY + gPadT;
        const plotW = gBoxW - gPadL - gPadR;
        const plotH = gBoxH - gPadT - gPadB;

        let maxY = Math.max(pred.maxFinal, pred.currentScore);
        for (const m of pred.refModels.slice(0, 3)) maxY = Math.max(maxY, m.hFinal);
        maxY = Math.ceil((maxY * 1.06) / 100000) * 100000 || 500000;

        const xOf = (p) => plotX + Math.max(0, Math.min(1, p)) * plotW;
        const yOf = (v) => plotY + plotH - (Math.max(0, v) / maxY) * plotH;

        ctx.font = `600 13px ${fontFam}`;
        ctx.textAlign = "right";
        for (let i = 0; i <= 4; i++) {
          const val = (maxY * i) / 4;
          const gy = yOf(val);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.10)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(plotX, gy);
          ctx.lineTo(plotX + plotW, gy);
          ctx.stroke();

          ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
          const lbl = val >= 10000 ? `${(val / 10000).toFixed(0)}万` : Engine.formatNumber(val);
          ctx.fillText(lbl, plotX - 10, gy + 4);
        }

        ctx.textAlign = "center";
        const stepH = pred.totalH <= 48 ? 12 : 24;
        for (let hr = 0; hr <= pred.totalH; hr += stepH) {
          const gx = xOf(hr / pred.totalH);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
          ctx.beginPath();
          ctx.moveTo(gx, plotY);
          ctx.lineTo(gx, plotY + plotH);
          ctx.stroke();

          ctx.fillStyle = "rgba(255, 255, 255, 0.68)";
          ctx.fillText(`${hr}h`, gx, plotY + plotH + 20);
        }
        ctx.textAlign = "left";

        pred.refModels.slice(0, 2).forEach((m) => {
          const g = m.graph;
          const dur = g.endTime - g.startTime;
          ctx.save();
          ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          const step = Math.max(1, Math.floor(g.tier.length / 120));
          for (let i = 0; i < g.tier.length; i += step) {
            const [t, v] = g.tier[i];
            const px = xOf((t - g.startTime) / dur);
            const py = yOf(v);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.restore();
        });

        if (!pred.isFinished && pred.forecastSeries.length > 1) {
          ctx.save();
          ctx.fillStyle = theme.bandFill;
          ctx.beginPath();
          pred.forecastSeries.forEach((pt, i) => {
            const px = xOf(pt.p);
            const py = yOf(pt.max);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          for (let i = pred.forecastSeries.length - 1; i >= 0; i--) {
            const pt = pred.forecastSeries[i];
            ctx.lineTo(xOf(pt.p), yOf(pt.min));
          }
          ctx.closePath();
          ctx.fill();

          ctx.setLineDash([7, 5]);
          ctx.lineWidth = 3.2;
          ctx.strokeStyle = theme.forecast;
          if (theme.sparkle) {
            ctx.shadowColor = theme.glowColor;
            ctx.shadowBlur = 10;
          }
          ctx.beginPath();
          pred.forecastSeries.forEach((pt, i) => {
            const px = xOf(pt.p);
            const py = yOf(pt.central);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          });
          ctx.stroke();
          ctx.restore();
        }

        const tPts = pred.targetGraph.tier;
        const tDur = pred.targetGraph.endTime - pred.targetGraph.startTime;
        ctx.save();
        if (theme.rainbow) {
          const lineGrad = ctx.createLinearGradient(plotX, 0, plotX + plotW, 0);
          lineGrad.addColorStop(0, "#ff4d6d");
          lineGrad.addColorStop(0.3, "#ffb703");
          lineGrad.addColorStop(0.6, "#06d6a0");
          lineGrad.addColorStop(1, "#3a86ff");
          ctx.strokeStyle = lineGrad;
        } else {
          ctx.strokeStyle = theme.accent;
        }
        ctx.lineWidth = 3.8;
        if (theme.sparkle) {
          ctx.shadowColor = theme.glowColor;
          ctx.shadowBlur = 12;
        }
        ctx.beginPath();
        const step = Math.max(1, Math.floor(tPts.length / 180));
        for (let i = 0; i < tPts.length; i += step) {
          const [t, v] = tPts[i];
          const px = xOf((t - pred.targetGraph.startTime) / tDur);
          const py = yOf(v);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        const [lt, lv] = tPts[tPts.length - 1];
        const lx = xOf((lt - pred.targetGraph.startTime) / tDur);
        const ly = yOf(lv);
        ctx.lineTo(lx, ly);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(lx, ly, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        const endY = yOf(pred.centralFinal);
        ctx.save();
        ctx.fillStyle = theme.forecast;
        ctx.beginPath();
        ctx.arc(xOf(1), endY, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // -----------------------------------------------------------------------
      // CanvasをDiscord投稿用Blob（850KB以下）へ変換
      // -----------------------------------------------------------------------
      function exportCanvasBlob() {
        return new Promise((resolve) => {
          el.tripleCanvas.toBlob((pngBlob) => {
            if (pngBlob && pngBlob.size <= 850 * 1024) {
              resolve({ blob: pngBlob, filename: "border_prediction.png" });
            } else {
              el.tripleCanvas.toBlob(
                (jpgBlob) => resolve({ blob: jpgBlob, filename: "border_prediction.jpg" }),
                "image/jpeg",
                0.90
              );
            }
          }, "image/png");
        });
      }

      // -----------------------------------------------------------------------
      // サーバー同期・API取得・配信アクション
      // -----------------------------------------------------------------------
      async function bootstrapDashboard() {
        setStatus("サーバーデータを読み込み中...");
        const [bootRes] = await Promise.all([
          apiFetch("/api/admin/bootstrap"),
          state.archiveItems.length === 0 ? loadArchiveFromGithub() : Promise.resolve(),
        ]);
        const data = await bootRes.json();

        state.events = data.events || [];
        state.graphs = data.graphs || {};
        state.manualAdjustments = data.manualAdjustments || {};
        state.guildSettings = data.guildSettings || {};
        state.subscriptionCount = Number(data.subscriptionCount) || 0;
        state.lastManualUpdateAt = Number(data.lastManualUpdateAt) || 0;
        state.lastAutoFetchAt = Number(data.lastAutoFetchAt) || 0;
        state.nowBorderCache = data.nowBorderCache || null;
        state.predictionCacheMeta = data.predictionCacheMeta || null;

        el.subCountBadge.textContent = `購読: ${state.subscriptionCount} ch`;
        el.lastAutoFetchLabel.textContent = state.lastAutoFetchAt ? Engine.formatJST(state.lastAutoFetchAt) : "未実行";
        el.lastManualUpdateLabel.textContent = state.lastManualUpdateAt ? Engine.formatJST(state.lastManualUpdateAt) : "未実行";
        el.cacheTimeLabel.textContent = state.nowBorderCache?.timeLabel || state.predictionCacheMeta?.timeLabel || "未生成";

        buildTargetList();
        recalculateAndRender();
        setStatus("最新データと同期しました。", "var(--success)");
      }

      async function handleFetchNewApi() {
        el.fetchApiBtn.disabled = true;
        setStatus("holodori-border.com APIから最新ボーダーを取得中...");
        try {
          const res = await apiFetch("/api/admin/fetch-api", { method: "POST" });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "API取得失敗");

          state.events = data.events || state.events;
          state.graphs = data.graphs || state.graphs;
          state.nowBorderCache = data.nowBorderCache || state.nowBorderCache;
          state.lastAutoFetchAt = Date.now();
          state.textManuallyEdited = false;

          el.lastAutoFetchLabel.textContent = Engine.formatJST(state.lastAutoFetchAt);
          if (state.nowBorderCache?.timeLabel) {
            el.cacheTimeLabel.textContent = state.nowBorderCache.timeLabel;
          }

          if (data.result?.targetKey) {
            state.selectedKey = data.result.targetKey;
          }
          buildTargetList();
          recalculateAndRender();

          if (data.result?.fetched) {
            setStatus(`API取得完了: ${data.result.shortLabel} (${data.result.timeLabel})`, "var(--success)");
            showToast("✅ APIから最新ボーダーを取得しました");
          } else {
            setStatus("現在開催中の対象イベント/チャプターはありません。", "var(--warning)");
            showToast("⚠️ 開催中の対象イベントが見つかりませんでした");
          }
        } catch (err) {
          setStatus(`エラー: ${err.message}`, "var(--danger)");
          showToast(`❌ ${err.message}`);
        } finally {
          el.fetchApiBtn.disabled = false;
        }
      }

      async function submitCacheOrBroadcast(shouldNotify) {
        if (shouldNotify) {
          const ok = confirm(
            `登録済みの全チャンネル（${state.subscriptionCount}ch）にボーダー予測を一斉送信します。よろしいですか？`
          );
          if (!ok) return;
        }

        el.updateCacheOnlyBtn.disabled = true;
        el.broadcastBtn.disabled = true;
        setStatus(shouldNotify ? "画像を生成してDiscordへ一斉配信中..." : "キャッシュを更新中...");

        try {
          const { blob, filename } = await exportCanvasBlob();
          const form = new FormData();
          form.append("image", blob, filename);
          form.append("nowBorderText", el.nowBorderTextarea.value.trim());
          form.append("customText", el.customTextInput.value.trim());
          form.append("customTextPosition", el.customPosSelect.value);
          form.append("notify", shouldNotify ? "true" : "false");
          form.append("respectMuteTime", el.respectMuteCheck.checked ? "true" : "false");
          form.append("eventKey", state.selectedKey);
          form.append("manualAdjustments", JSON.stringify(state.manualAdjustments[state.selectedKey] || {}));

          const endpoint = shouldNotify ? "/api/admin/broadcast" : "/api/admin/update-cache";
          const res = await apiFetch(endpoint, { method: "POST", body: form });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "送信エラー");

          state.lastManualUpdateAt = Date.now();
          el.lastManualUpdateLabel.textContent = Engine.formatJST(state.lastManualUpdateAt);
          const m = /最終更新\(([^)]+)\)/.exec(el.nowBorderTextarea.value);
          if (m) el.cacheTimeLabel.textContent = m[1];

          setStatus(data.message, "var(--success)");
          showToast(data.message);
        } catch (err) {
          setStatus(`エラー: ${err.message}`, "var(--danger)");
          showToast(`❌ ${err.message}`);
        } finally {
          el.updateCacheOnlyBtn.disabled = false;
          el.broadcastBtn.disabled = false;
        }
      }

      // -----------------------------------------------------------------------
      // イベントリスナー登録
      // -----------------------------------------------------------------------
      async function attemptLogin(pw) {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: pw }),
        });
        if (!res.ok) {
          showToast("❌ パスワードが正しくありません");
          return;
        }
        state.password = pw;
        sessionStorage.setItem("holodori_admin_pw", pw);
        el.loginScreen.style.display = "none";
        el.appScreen.style.display = "block";
        await bootstrapDashboard();
      }

      el.loginBtn.addEventListener("click", () => attemptLogin(el.passwordInput.value));
      el.passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") attemptLogin(el.passwordInput.value);
      });

      el.logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem("holodori_admin_pw");
        location.reload();
      });

      el.fetchApiBtn.addEventListener("click", handleFetchNewApi);
      el.reloadAllBtn.addEventListener("click", bootstrapDashboard);

      el.eventSelect.addEventListener("change", (e) => {
        state.selectedKey = e.target.value;
        state.textManuallyEdited = false;
        recalculateAndRender();
      });

      el.nowBorderTextarea.addEventListener("input", () => {
        state.textManuallyEdited = true;
      });

      el.saveAdjBtn.addEventListener("click", () => submitCacheOrBroadcast(false));

      el.resetAdjBtn.addEventListener("click", () => {
        if (!state.selectedKey) return;
        state.manualAdjustments[state.selectedKey] = { "1000": 0, "5000": 0, "10000": 0 };
        recalculateAndRender();
        showToast("補正値を 0 にリセットしました");
      });

      el.copyTextBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(el.nowBorderTextarea.value);
          showToast("📋 テキストをクリップボードにコピーしました");
        } catch (_) {
          el.nowBorderTextarea.select();
          document.execCommand("copy");
          showToast("📋 コピーしました");
        }
      });

      el.downloadImgBtn.addEventListener("click", async () => {
        const { blob, filename } = await exportCanvasBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });

      el.updateCacheOnlyBtn.addEventListener("click", () => submitCacheOrBroadcast(false));
      el.broadcastBtn.addEventListener("click", () => submitCacheOrBroadcast(true));

      // セッション復元
      if (state.password) {
        attemptLogin(state.password).catch(() => {});
      }
    })();
  </script>
</body>
