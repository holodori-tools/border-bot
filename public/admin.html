<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ホロドリ ボーダー着地予測＆Discord配信管理パネル</title>
  <!-- 共通予測・高解像度レポート描画エンジン（サーバー側と単一ソース共有） -->
  <script src="/engine.js"></script>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-panel: #131929;
      --bg-card: #1a2236;
      --border: rgba(255, 255, 255, 0.12);
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
    }

    /* エンジン未読込時の警告バナー */
    #engineErrorBanner {
      display: none;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid var(--danger);
      color: #fecaca;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: left;
    }

    /* ログイン画面 */
    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 70%);
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    .login-box h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
    }
    .login-box p {
      margin: 0 0 22px;
      font-size: 13px;
      color: var(--text-sub);
    }
    .login-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0f19;
      color: #fff;
      font-size: 16px;
      margin-bottom: 14px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--accent); }

    /* ボタン共通 */
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 16px;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #082f49; }
    .btn-primary:hover:not(:disabled) { background: #7dd3fc; }
    .btn-success { background: var(--success); color: #022c22; }
    .btn-success:hover:not(:disabled) { background: #34d399; }
    .btn-warning { background: var(--warning); color: #271502; }
    .btn-warning:hover:not(:disabled) { background: #fbbf24; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
    .btn-full { width: 100%; }

    /* メイン管理画面 */
    #appScreen { display: none; padding-bottom: 48px; }

    header.topbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .container {
      max-width: 1440px;
      margin: 20px auto 0;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ステータスバー */
    .status-strip {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    .status-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      color: var(--text-sub);
    }
    .status-meta strong { color: var(--text-main); }

    /* コントロール＆グリッド */
    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
    }
    @media (max-width: 1024px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card-header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label.field-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }
    select, input[type="text"], input[type="number"], textarea {
      width: 100%;
      background: #0b0f19;
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; line-height: 1.5; }

    /* 3ランク個別カード＆手動補正 */
    .tier-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 960px) {
      .tier-grid { grid-template-columns: 1fr; }
    }
    .tier-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tier-box-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .tier-title {
      font-size: 16px;
      font-weight: 800;
    }
    .tier-rank-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
    }
    .tier-pred-val {
      font-size: 24px;
      font-weight: 800;
      color: #fbbf24;
    }
    .tier-sub-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
    }
    .tier-sub-row span.val {
      color: var(--text-main);
      font-weight: 700;
    }
    .adj-control {
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .adj-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .adj-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }
    .adj-row input[type="number"] {
      width: 115px;
      padding: 6px 8px;
      font-size: 13px;
      text-align: right;
    }

    /* プレビューキャンバス */
    .preview-wrap {
      width: 100%;
      overflow-x: auto;
      background: #070a12;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    canvas#tripleCanvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    /* 配信コントロール */
    .broadcast-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }
    @media (max-width: 640px) {
      .broadcast-actions { grid-template-columns: 1fr; }
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-main);
      margin-top: 10px;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    /* トースト通知 */
    #toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #1e293b;
      color: #fff;
      border: 1px solid rgba(56, 189, 248, 0.5);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      z-index: 100;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: 0.2s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* カスタム確認モーダル（alert/confirm代替） */
    #confirmModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #confirmModal.show {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    .modal-card h3 {
      margin: 0 0 10px;
      font-size: 17px;
      font-weight: 800;
    }
    .modal-card p {
      margin: 0 0 20px;
      font-size: 14px;
      color: var(--text-sub);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- 1. ログイン画面 -->
  <div id="loginScreen">
    <div class="login-box">
      <div id="engineErrorBanner"></div>
      <h1>ホロドリ ボーダー管理パネル</h1>
      <p>管理者パスワードを入力してください</p>
      <input type="password" id="passwordInput" placeholder="パスワード" autocomplete="current-password" />
      <button id="loginBtn" class="btn-primary btn-full">ログイン</button>
    </div>
  </div>

  <!-- 2. 管理ダッシュボード -->
  <div id="appScreen">
    <header class="topbar">
      <div class="topbar-title">
        <h1>ホロドリ ボーダー予測 ＆ Discord配信管理</h1>
        <span class="badge" id="subCountBadge">購読: - ch</span>
      </div>
      <div class="topbar-actions">
        <button id="fetchApiBtn" class="btn-primary">🔄 APIから最新データ取得</button>
        <button id="reloadAllBtn" class="btn-secondary">サーバー再同期</button>
        <button id="logoutBtn" class="btn-secondary">ログアウト</button>
      </div>
    </header>

    <div class="container">
      <!-- ステータスバー -->
      <div class="status-strip">
        <div id="statusMessage" style="font-weight:700; color: var(--accent);">準備完了</div>
        <div class="status-meta">
          <span>自動API更新: <strong id="lastAutoFetchLabel">-</strong></span>
          <span>手動更新: <strong id="lastManualUpdateLabel">-</strong></span>
          <span>キャッシュ時刻: <strong id="cacheTimeLabel">-</strong></span>
        </div>
      </div>

      <!-- イベント選択 ＆ 3ランク予測・手動補正 -->
      <div class="card">
        <div class="card-header">
          <h2>📊 対象イベント・チャプター選択 ＆ 着地予測モデル</h2>
          <div style="display:flex; gap:8px;">
            <button id="saveAdjBtn" class="btn-secondary">補正値を保存</button>
            <button id="resetAdjBtn" class="btn-secondary">補正リセット</button>
          </div>
        </div>

        <div style="margin-bottom: 16px;">
          <label class="field-label" for="eventSelect">表示・配信するイベント / チャプター</label>
          <select id="eventSelect"></select>
        </div>

        <div class="tier-grid" id="tierCardsContainer"></div>
      </div>

      <!-- プレビュー画像 ＆ Discord一斉配信パネル -->
      <div class="grid-2">
        <!-- 左：トリプル比較画像プレビュー -->
        <div class="card">
          <div class="card-header">
            <h2>🖼️ Discord配信用 予測画像プレビュー (2160×820)</h2>
            <button id="downloadImgBtn" class="btn-secondary">画像を保存</button>
          </div>
          <div class="preview-wrap">
            <canvas id="tripleCanvas" width="2160" height="820"></canvas>
          </div>
        </div>

        <!-- 右：テキスト編集 ＆ 一斉配信・キャッシュ更新 -->
        <div class="card">
          <div class="card-header">
            <h2>📣 Discord 一斉通知 ＆ キャッシュ更新</h2>
            <button id="copyTextBtn" class="btn-secondary">テキストコピー</button>
          </div>

          <div style="margin-bottom: 12px;">
            <label class="field-label" for="nowBorderTextarea">現在ボーダー本文（/nowborder・/border・定時通知共通）</label>
            <textarea id="nowBorderTextarea" rows="5"></textarea>
          </div>

          <div style="margin-bottom: 12px;">
            <label class="field-label" for="customTextInput">追加メッセージ（任意・一斉通知時のみ添付）</label>
            <textarea id="customTextInput" rows="3" placeholder="例：終盤スパートに入りました！ラスト3時間は30分ごとに通知します。"></textarea>
          </div>

          <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px;">
            <div style="min-width: 180px;">
              <label class="field-label" for="customPosSelect">追加メッセージの配置</label>
              <select id="customPosSelect">
                <option value="below">画像・本文の下に送信</option>
                <option value="above">本文の上に連結して送信</option>
              </select>
            </div>

            <label class="checkbox-row">
              <input type="checkbox" id="respectMuteCheck" checked />
              <span>サーバー別の通知ミュート時間帯を尊重する</span>
            </label>
          </div>

          <div class="broadcast-actions">
            <button id="updateCacheOnlyBtn" class="btn-warning">💾 キャッシュのみ更新（通知なし）</button>
            <button id="broadcastBtn" class="btn-success">🚀 キャッシュ更新 ＋ Discord一斉通知</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 確認モーダル -->
  <div id="confirmModal">
    <div class="modal-card">
      <h3>一斉通知の確認</h3>
      <p id="confirmModalBody"></p>
      <div class="modal-actions">
        <button id="confirmCancelBtn" class="btn-secondary">キャンセル</button>
        <button id="confirmOkBtn" class="btn-success">送信する</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    (() => {
      // -----------------------------------------------------------------------
      // 0. 共通エンジン（window.HolodoriBorderEngine）の検証とフォールバック
      // -----------------------------------------------------------------------
      const Engine = window.HolodoriBorderEngine;
      const engineErrorBanner = document.getElementById("engineErrorBanner");

      if (!Engine) {
        if (engineErrorBanner) {
          engineErrorBanner.style.display = "block";
          engineErrorBanner.innerHTML =
            "<strong>⚠️ 共通エンジン (/engine.js) の読み込みに失敗しました。</strong><br>" +
            "サーバー側で <code>public/engine.js</code> が配信されているか確認してください（<code>/engine.js</code> が 404 でないか確認）。";
        }
        // ログインボタン自体は反応するよう最小限の診断ハンドラを登録
        const fallbackLogin = async () => {
          const pw = document.getElementById("passwordInput")?.value || "";
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });
          if (!res.ok) {
            if (engineErrorBanner) {
              engineErrorBanner.innerHTML += "<br>※ パスワード認証も失敗しました。";
            }
            return;
          }
          sessionStorage.setItem("holodori_admin_pw", pw);
          if (engineErrorBanner) {
            engineErrorBanner.innerHTML =
              "<strong>✅ パスワード認証は成功しましたが、/engine.js が読み込めないため画面を描画できません。</strong><br>" +
              "サーバーの <code>public/engine.js</code> 配置と静的ファイル配信設定を確認して再読み込みしてください。";
          }
        };
        document.getElementById("loginBtn")?.addEventListener("click", fallbackLogin);
        return;
      }

      const { TIER_DEFS } = Engine;
      const GITHUB_ARCHIVE_BASE = "https://raw.githubusercontent.com/holodori-tools/event-borders/main/archive";

      // 共通高解像度レンダラー生成（背景オフスクリーンキャッシュ＆キャンバス再利用内蔵）
      const reportRenderer = Engine.createReportRenderer({
        fontFamily: '"Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif',
        monoFamily: '"Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", monospace',
      });

      // アプリケーション状態
      const state = {
        password: sessionStorage.getItem("holodori_admin_pw") || "",
        events: [],
        graphs: {},
        archiveItems: [],
        archiveGraphs: {},
        manualAdjustments: {},
        guildSettings: {},
        subscriptionCount: 0,
        lastManualUpdateAt: 0,
        lastAutoFetchAt: 0,
        nowBorderCache: null,
        predictionCacheMeta: null,
        allTargets: [],
        selectedKey: "",
        predsByRank: {},
        textManuallyEdited: false,
      };

      // DOM要素
      const el = {
        loginScreen: document.getElementById("loginScreen"),
        appScreen: document.getElementById("appScreen"),
        passwordInput: document.getElementById("passwordInput"),
        loginBtn: document.getElementById("loginBtn"),
        logoutBtn: document.getElementById("logoutBtn"),
        fetchApiBtn: document.getElementById("fetchApiBtn"),
        reloadAllBtn: document.getElementById("reloadAllBtn"),
        subCountBadge: document.getElementById("subCountBadge"),
        statusMessage: document.getElementById("statusMessage"),
        lastAutoFetchLabel: document.getElementById("lastAutoFetchLabel"),
        lastManualUpdateLabel: document.getElementById("lastManualUpdateLabel"),
        cacheTimeLabel: document.getElementById("cacheTimeLabel"),
        eventSelect: document.getElementById("eventSelect"),
        tierCardsContainer: document.getElementById("tierCardsContainer"),
        saveAdjBtn: document.getElementById("saveAdjBtn"),
        resetAdjBtn: document.getElementById("resetAdjBtn"),
        tripleCanvas: document.getElementById("tripleCanvas"),
        downloadImgBtn: document.getElementById("downloadImgBtn"),
        nowBorderTextarea: document.getElementById("nowBorderTextarea"),
        copyTextBtn: document.getElementById("copyTextBtn"),
        customTextInput: document.getElementById("customTextInput"),
        customPosSelect: document.getElementById("customPosSelect"),
        respectMuteCheck: document.getElementById("respectMuteCheck"),
        updateCacheOnlyBtn: document.getElementById("updateCacheOnlyBtn"),
        broadcastBtn: document.getElementById("broadcastBtn"),
        toast: document.getElementById("toast"),
        confirmModal: document.getElementById("confirmModal"),
        confirmModalBody: document.getElementById("confirmModalBody"),
        confirmCancelBtn: document.getElementById("confirmCancelBtn"),
        confirmOkBtn: document.getElementById("confirmOkBtn"),
      };

      let toastTimer = null;
      function showToast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove("show"), 3400);
      }

      function setStatus(msg, color = "var(--accent)") {
        el.statusMessage.textContent = msg;
        el.statusMessage.style.color = color;
      }

      function askConfirmModal(message) {
        return new Promise((resolve) => {
          el.confirmModalBody.textContent = message;
          el.confirmModal.classList.add("show");

          const cleanup = (result) => {
            el.confirmModal.classList.remove("show");
            el.confirmOkBtn.removeEventListener("click", onOk);
            el.confirmCancelBtn.removeEventListener("click", onCancel);
            resolve(result);
          };
          const onOk = () => cleanup(true);
          const onCancel = () => cleanup(false);

          el.confirmOkBtn.addEventListener("click", onOk);
          el.confirmCancelBtn.addEventListener("click", onCancel);
        });
      }

      async function apiFetch(url, options = {}) {
        const headers = {
          ...(options.headers || {}),
          "x-admin-password": state.password,
        };
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401) {
          sessionStorage.removeItem("holodori_admin_pw");
          state.password = "";
          el.appScreen.style.display = "none";
          el.loginScreen.style.display = "flex";
          throw new Error("認証エラー：再ログインしてください。");
        }
        return res;
      }

      // -----------------------------------------------------------------------
      // 1. GitHub過去アーカイブ読込
      // -----------------------------------------------------------------------
      async function loadArchiveFromGithub() {
        try {
          const res = await fetch(`${GITHUB_ARCHIVE_BASE}/index.json?t=${Math.floor(Date.now() / 60000)}`, {
            cache: "no-store",
          });
          if (!res.ok) return;
          const manifest = await res.json();
          const entries = Array.isArray(manifest) ? manifest : Array.isArray(manifest.items) ? manifest.items : [];

          const items = [];
          const graphs = {};

          for (const ent of entries) {
            const tierEntries = [];
            for (const [k, val] of Object.entries(ent)) {
              const m = /^t(\d+)$/i.exec(k);
              if (m && typeof val === "string" && val.trim() !== "") {
                tierEntries.push({ rankHint: Number(m[1]), file: val.trim() });
              }
            }
            if (tierEntries.length === 0 && typeof ent.file === "string") {
              tierEntries.push({ rankHint: ent.rank || 5000, file: ent.file.trim() });
            }

            const displayName = ent.tag || ent.name || ent.chapterId || ent.eventId || "archive";
            const key = ent.eventId && ent.chapterId ? `${ent.eventId}::${ent.chapterId}` : `archive::${displayName}`;

            const fetched = await Promise.all(
              tierEntries.map(async (te) => {
                try {
                  const gRes = await fetch(`${GITHUB_ARCHIVE_BASE}/${te.file}`);
                  if (!gRes.ok) return null;
                  const graph = await gRes.json();
                  if (!graph || !Array.isArray(graph.tier) || graph.tier.length === 0) return null;
                  return { actualRank: Number(graph.rank) || te.rankHint, graph };
                } catch (_) {
                  return null;
                }
              })
            );

            let repGraph = null;
            for (const item of fetched) {
              if (!item) continue;
              graphs[`${key}::${item.actualRank}`] = item.graph;
              if (!repGraph) repGraph = item.graph;
            }

            if (repGraph) {
              const durH = (repGraph.endTime - repGraph.startTime) / 3600000;
              const cat = ent.category || "spotlight";
              items.push({
                key,
                eventId: ent.eventId || "archive",
                chapterId: ent.chapterId || displayName,
                category: cat,
                catLabel: cat === "point" ? "ポイントイベント" : "スポットライト",
                eventName: displayName,
                chapterName: null,
                shortLabel: displayName,
                startTime: repGraph.startTime,
                endTime: repGraph.endTime,
                durationH: durH,
                live: false,
                isArchive: true,
              });
            }
          }

          state.archiveItems = items;
          state.archiveGraphs = graphs;
        } catch (err) {
          console.warn("[Archive] 読込エラー:", err);
        }
      }

      // -----------------------------------------------------------------------
      // 2. イベント＆チャプター一覧構築
      // -----------------------------------------------------------------------
      function buildTargetList() {
        const list = [];
        const seen = new Set();

        // 1. Redis上の最新・開催中イベント群
        for (const ev of state.events) {
          if (!ev || !ev.eventId || ev.isSongScore) continue;
          const isRelay = Number(ev.type) === 2 || (Array.isArray(ev.chapters) && ev.chapters.length > 1);
          const category = isRelay ? "spotlight" : "point";
          const catLabel = isRelay ? "スポットライト" : "ポイントイベント";

          if (Array.isArray(ev.chapters) && ev.chapters.length > 0) {
            for (const chId of ev.chapters) {
              const key = `${ev.eventId}::${chId}`;
              if (seen.has(key)) continue;
              const meta = ev.chapterMeta?.[chId] || {};
              const repGraph =
                state.graphs[`${key}::5000`] ||
                state.graphs[`${key}::1000`] ||
                state.graphs[`${key}::10000`];
              const st = meta.startTime || repGraph?.startTime || ev.startTime;
              const et = meta.endTime || repGraph?.endTime || ev.endTime;
              if (!st || !et) continue;

              const now = Date.now();
              const live = now >= st && now <= et;
              const chName = meta.name || null;
              const shortCh = meta.shortName || chId;

              seen.add(key);
              list.push({
                key,
                eventId: ev.eventId,
                chapterId: chId,
                category,
                catLabel,
                eventName: ev.name || ev.eventId,
                chapterName: chName,
                shortLabel: chName ? `${ev.name} / ${shortCh}` : ev.name || ev.eventId,
                startTime: st,
                endTime: et,
                durationH: (et - st) / 3600000,
                live,
                hasGraphs: Boolean(repGraph),
              });
            }
          } else {
            const prefixCandidates = new Set();
            for (const gKey of Object.keys(state.graphs)) {
              if (gKey.startsWith(`${ev.eventId}::`)) {
                prefixCandidates.add(gKey.replace(/::\d+$/, ""));
              }
            }
            if (prefixCandidates.size === 0 && ev.startTime && ev.endTime) {
              prefixCandidates.add(`${ev.eventId}::default`);
            }
            for (const key of prefixCandidates) {
              if (seen.has(key)) continue;
              const repGraph =
                state.graphs[`${key}::5000`] ||
                state.graphs[`${key}::1000`] ||
                state.graphs[`${key}::10000`];
              const st = repGraph?.startTime || ev.startTime;
              const et = repGraph?.endTime || ev.endTime;
              if (!st || !et) continue;

              const now = Date.now();
              seen.add(key);
              list.push({
                key,
                eventId: ev.eventId,
                chapterId: key.split("::")[1] || "default",
                category,
                catLabel,
                eventName: ev.name || ev.eventId,
                chapterName: null,
                shortLabel: ev.name || ev.eventId,
                startTime: st,
                endTime: et,
                durationH: (et - st) / 3600000,
                live: now >= st && now <= et,
                hasGraphs: Boolean(repGraph),
              });
            }
          }
        }

        // 2. graphs にのみ存在するキー補完
        const graphPrefixes = new Set(Object.keys(state.graphs).map((k) => k.replace(/::\d+$/, "")));
        for (const key of graphPrefixes) {
          if (seen.has(key)) continue;
          const repGraph =
            state.graphs[`${key}::5000`] ||
            state.graphs[`${key}::1000`] ||
            state.graphs[`${key}::10000`];
          if (!repGraph) continue;
          const durH = (repGraph.endTime - repGraph.startTime) / 3600000;
          const isSpot = durH <= 80;
          seen.add(key);
          list.push({
            key,
            eventId: repGraph.eventId || key.split("::")[0],
            chapterId: repGraph.chapterId || key.split("::")[1] || "default",
            category: isSpot ? "spotlight" : "point",
            catLabel: isSpot ? "スポットライト" : "ポイントイベント",
            eventName: repGraph.eventId || key,
            chapterName: null,
            shortLabel: key,
            startTime: repGraph.startTime,
            endTime: repGraph.endTime,
            durationH: durH,
            live: Date.now() >= repGraph.startTime && Date.now() <= repGraph.endTime,
            hasGraphs: true,
          });
        }

        // 3. 過去アーカイブ補完
        for (const aItem of state.archiveItems) {
          if (seen.has(aItem.key)) continue;
          seen.add(aItem.key);
          list.push({ ...aItem, hasGraphs: true });
        }

        // ソート：開催中 > グラフデータ有り新しい順 > 開始日時新しい順
        list.sort((a, b) => {
          if (a.live !== b.live) return a.live ? -1 : 1;
          if (Boolean(a.hasGraphs) !== Boolean(b.hasGraphs)) return a.hasGraphs ? -1 : 1;
          return (b.startTime || 0) - (a.startTime || 0);
        });

        state.allTargets = list;

        // プルダウン描画
        el.eventSelect.innerHTML = "";
        for (const item of list) {
          const opt = document.createElement("option");
          opt.value = item.key;
          const statusTag = item.live ? "🔴開催中" : item.isArchive ? "📦過去アーカイブ" : "⚪終了";
          opt.textContent = `[${statusTag}] ${item.shortLabel} (${Engine.formatJST(item.startTime, true)}〜)`;
          el.eventSelect.appendChild(opt);
        }

        if (!state.selectedKey || !list.some((i) => i.key === state.selectedKey)) {
          state.selectedKey = list[0]?.key || "";
        }
        el.eventSelect.value = state.selectedKey;
      }

      // -----------------------------------------------------------------------
      // 3. 予測計算（Engine.computePrediction）＆ UI・Canvas更新
      // -----------------------------------------------------------------------
      function recalculateAndRender() {
        const target = state.allTargets.find((t) => t.key === state.selectedKey);
        if (!target) return;

        const predsByRank = {};
        const mergedGraphsForTarget = {};
        const adjMap = state.manualAdjustments[target.key] || {};

        for (const tierDef of TIER_DEFS) {
          const gKey = `${target.key}::${tierDef.rank}`;
          const targetGraph = state.graphs[gKey] || state.archiveGraphs[gKey] || null;
          if (targetGraph) {
            mergedGraphsForTarget[gKey] = targetGraph;
          }

          if (!targetGraph || !Array.isArray(targetGraph.tier) || targetGraph.tier.length === 0) {
            predsByRank[tierDef.rank] = null;
            continue;
          }

          // 参照過去データ収集
          const refPairs = [];
          for (const aItem of state.archiveItems) {
            if (aItem.key === target.key || aItem.category !== target.category) continue;
            const g = state.archiveGraphs[`${aItem.key}::${tierDef.rank}`];
            if (g) refPairs.push({ item: aItem, graph: g });
          }
          for (const [k, gVal] of Object.entries(state.graphs)) {
            if (!k.endsWith(`::${tierDef.rank}`) || k.startsWith(`${target.key}::`)) continue;
            if (!gVal || !Array.isArray(gVal.tier) || gVal.tier.length < 15) continue;
            const gProg =
              (gVal.tier[gVal.tier.length - 1][0] - gVal.startTime) /
              Math.max(1, gVal.endTime - gVal.startTime);
            if (gProg < 0.98) continue;
            const prefix = k.replace(/::\d+$/, "");
            refPairs.push({
              item: {
                key: prefix,
                eventId: gVal.eventId || prefix,
                chapterId: gVal.chapterId || prefix,
                category: target.category,
                durationH: (gVal.endTime - gVal.startTime) / 3600000,
                live: false,
              },
              graph: gVal,
            });
          }

          predsByRank[tierDef.rank] = Engine.computePrediction(
            target,
            targetGraph,
            refPairs,
            tierDef.rank,
            Number(adjMap[tierDef.rank]) || 0
          );
        }

        state.predsByRank = predsByRank;

        // 3ランクカードUI更新
        renderTierCards(target, predsByRank);

        // NowBorderテキスト自動生成（Engine.buildNowBorderPayloadFromGraphs を使用）
        if (!state.textManuallyEdited) {
          const built = Engine.buildNowBorderPayloadFromGraphs(mergedGraphsForTarget, target.key);
          if (built && built.text) {
            el.nowBorderTextarea.value = built.text;
          } else if (state.nowBorderCache?.text) {
            el.nowBorderTextarea.value = state.nowBorderCache.text;
          } else {
            el.nowBorderTextarea.value = "";
          }
        }

        // トリプル比較画像描画（Engine.createReportRenderer を使用）
        reportRenderer.renderReport({
          mode: "triple",
          primaryItem: target,
          slots: TIER_DEFS.map((t) => ({
            item: target,
            rank: t.rank,
            pred: predsByRank[t.rank] || null,
          })),
          targetCanvas: el.tripleCanvas,
        });
      }

      function renderTierCards(target, predsByRank) {
        el.tierCardsContainer.innerHTML = "";
        const adjMap = state.manualAdjustments[target.key] || {};

        for (const tierDef of TIER_DEFS) {
          const pred = predsByRank[tierDef.rank];
          const theme = Engine.getTierTheme(tierDef.rank);
          const rankTitle = Engine.getTierRankTitle(tierDef.rank) || tierDef.label;
          const curAdj = Number(adjMap[tierDef.rank]) || 0;

          const box = document.createElement("div");
          box.className = "tier-box";
          box.style.borderColor = theme.borderStops[0];

          if (!pred) {
            box.innerHTML = `
              <div class="tier-box-top">
                <span class="tier-title" style="color:${theme.primary}">${rankTitle}</span>
                <span class="tier-rank-pill">T${tierDef.rank.toLocaleString()}</span>
              </div>
              <div style="color:var(--text-sub); font-size:13px; padding:18px 0;">データ未取得</div>
            `;
            el.tierCardsContainer.appendChild(box);
            continue;
          }

          box.innerHTML = `
            <div class="tier-box-top">
              <span class="tier-title" style="color:${theme.primary}">${rankTitle}</span>
              <span class="tier-rank-pill">T${tierDef.rank.toLocaleString()}</span>
            </div>
            <div class="tier-pred-val" style="color:${theme.forecast}">
              ${Engine.formatNumber(pred.centralFinal)} pt
            </div>
            <div class="tier-sub-row">
              <span>現在スコア</span>
              <span class="val">${Engine.formatNumber(pred.currentScore)} pt</span>
            </div>
            <div class="tier-sub-row">
              <span>予測レンジ</span>
              <span class="val">${Engine.formatNumber(pred.minFinal)} 〜 ${Engine.formatNumber(pred.maxFinal)}</span>
            </div>
            <div class="tier-sub-row">
              <span>直近時速 / 類似度</span>
              <span class="val">${Engine.formatNumber(pred.recentPace)} pt/h (${Math.round((pred.metaInfo?.topShapeSim || 0) * 100)}%)</span>
            </div>
            <div class="adj-control">
              <div class="tier-sub-row">
                <span>手動着地補正 (pt)</span>
                <span class="val" style="color:${curAdj !== 0 ? "#38bdf8" : "var(--text-sub)"}">
                  ${curAdj > 0 ? "+" : ""}${Engine.formatNumber(curAdj)} pt
                </span>
              </div>
              <div class="adj-row">
                <input type="range" min="-500000" max="500000" step="5000" value="${curAdj}" data-rank="${tierDef.rank}" class="adj-slider" />
                <input type="number" step="5000" value="${curAdj}" data-rank="${tierDef.rank}" class="adj-num" />
              </div>
            </div>
          `;
          el.tierCardsContainer.appendChild(box);
        }

        // 補正スライダー＆数値入力イベント
        el.tierCardsContainer.querySelectorAll(".adj-slider, .adj-num").forEach((inp) => {
          inp.addEventListener("input", (e) => {
            const r = e.target.dataset.rank;
            const val = Number(e.target.value) || 0;
            if (!state.manualAdjustments[target.key]) state.manualAdjustments[target.key] = {};
            state.manualAdjustments[target.key][r] = val;
            recalculateAndRender();
          });
        });
      }

      // -----------------------------------------------------------------------
      // 4. CanvasをDiscord投稿用Blob（850KB以下）へ変換
      // -----------------------------------------------------------------------
      function exportCanvasBlob() {
        return new Promise((resolve) => {
          el.tripleCanvas.toBlob((pngBlob) => {
            if (pngBlob && pngBlob.size <= 850 * 1024) {
              resolve({ blob: pngBlob, filename: "border_prediction.png" });
            } else {
              el.tripleCanvas.toBlob(
                (jpgBlob) => resolve({ blob: jpgBlob, filename: "border_prediction.jpg" }),
                "image/jpeg",
                0.90
              );
            }
          }, "image/png");
        });
      }

      // -----------------------------------------------------------------------
      // 5. サーバー同期・API取得・配信アクション
      // -----------------------------------------------------------------------
      async function bootstrapDashboard() {
        setStatus("サーバーデータを読み込み中...");
        const [bootRes] = await Promise.all([
          apiFetch("/api/admin/bootstrap"),
          state.archiveItems.length === 0 ? loadArchiveFromGithub() : Promise.resolve(),
        ]);
        const data = await bootRes.json();

        state.events = data.events || [];
        state.graphs = data.graphs || {};
        state.manualAdjustments = data.manualAdjustments || {};
        state.guildSettings = data.guildSettings || {};
        state.subscriptionCount = Number(data.subscriptionCount) || 0;
        state.lastManualUpdateAt = Number(data.lastManualUpdateAt) || 0;
        state.lastAutoFetchAt = Number(data.lastAutoFetchAt) || 0;
        state.nowBorderCache = data.nowBorderCache || null;
        state.predictionCacheMeta = data.predictionCacheMeta || null;

        el.subCountBadge.textContent = `購読: ${state.subscriptionCount} ch`;
        el.lastAutoFetchLabel.textContent = state.lastAutoFetchAt ? Engine.formatJST(state.lastAutoFetchAt) : "未実行";
        el.lastManualUpdateLabel.textContent = state.lastManualUpdateAt ? Engine.formatJST(state.lastManualUpdateAt) : "未実行";
        el.cacheTimeLabel.textContent = state.nowBorderCache?.timeLabel || state.predictionCacheMeta?.timeLabel || "未生成";

        buildTargetList();
        recalculateAndRender();
        setStatus("最新データと同期しました。", "var(--success)");
      }

      async function handleFetchNewApi() {
        el.fetchApiBtn.disabled = true;
        setStatus("holodori-border.com APIから最新ボーダーを取得中...");
        try {
          const res = await apiFetch("/api/admin/fetch-api", { method: "POST" });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "API取得失敗");

          state.events = data.events || state.events;
          state.graphs = data.graphs || state.graphs;
          state.nowBorderCache = data.nowBorderCache || state.nowBorderCache;
          state.lastAutoFetchAt = Date.now();
          state.textManuallyEdited = false;

          el.lastAutoFetchLabel.textContent = Engine.formatJST(state.lastAutoFetchAt);
          if (state.nowBorderCache?.timeLabel) {
            el.cacheTimeLabel.textContent = state.nowBorderCache.timeLabel;
          }

          if (data.result?.targetKey) {
            state.selectedKey = data.result.targetKey;
          }
          buildTargetList();
          recalculateAndRender();

          if (data.result?.fetched) {
            setStatus(`API取得完了: ${data.result.shortLabel} (${data.result.timeLabel})`, "var(--success)");
            showToast("✅ APIから最新ボーダーを取得しました");
          } else {
            setStatus("現在開催中の対象イベント/チャプターはありません。", "var(--warning)");
            showToast("⚠️ 開催中の対象イベントが見つかりませんでした");
          }
        } catch (err) {
          setStatus(`エラー: ${err.message}`, "var(--danger)");
          showToast(`❌ ${err.message}`);
        } finally {
          el.fetchApiBtn.disabled = false;
        }
      }

      async function submitCacheOrBroadcast(shouldNotify) {
        if (shouldNotify) {
          const ok = await askConfirmModal(
            `登録済みの全チャンネル（${state.subscriptionCount}ch）にボーダー予測を一斉送信します。よろしいですか？`
          );
          if (!ok) return;
        }

        el.updateCacheOnlyBtn.disabled = true;
        el.broadcastBtn.disabled = true;
        setStatus(shouldNotify ? "画像を生成してDiscordへ一斉配信中..." : "キャッシュを更新中...");

        try {
          const { blob, filename } = await exportCanvasBlob();
          const form = new FormData();
          form.append("image", blob, filename);
          form.append("nowBorderText", el.nowBorderTextarea.value.trim());
          form.append("customText", el.customTextInput.value.trim());
          form.append("customTextPosition", el.customPosSelect.value);
          form.append("notify", shouldNotify ? "true" : "false");
          form.append("respectMuteTime", el.respectMuteCheck.checked ? "true" : "false");
          form.append("eventKey", state.selectedKey);
          form.append("manualAdjustments", JSON.stringify(state.manualAdjustments[state.selectedKey] || {}));

          const endpoint = shouldNotify ? "/api/admin/broadcast" : "/api/admin/update-cache";
          const res = await apiFetch(endpoint, { method: "POST", body: form });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "送信エラー");

          state.lastManualUpdateAt = Date.now();
          el.lastManualUpdateLabel.textContent = Engine.formatJST(state.lastManualUpdateAt);
          const m = /最終更新\(([^)]+)\)/.exec(el.nowBorderTextarea.value);
          if (m) el.cacheTimeLabel.textContent = m[1];

          setStatus(data.message, "var(--success)");
          showToast(data.message);
        } catch (err) {
          setStatus(`エラー: ${err.message}`, "var(--danger)");
          showToast(`❌ ${err.message}`);
        } finally {
          el.updateCacheOnlyBtn.disabled = false;
          el.broadcastBtn.disabled = false;
        }
      }

      // -----------------------------------------------------------------------
      // 6. イベントリスナー登録
      // -----------------------------------------------------------------------
      async function attemptLogin(pw) {
        el.loginBtn.disabled = true;
        try {
          const res = await fetch("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw }),
          });
          if (!res.ok) {
            showToast("❌ パスワードが正しくありません");
            return;
          }
          state.password = pw;
          sessionStorage.setItem("holodori_admin_pw", pw);
          el.loginScreen.style.display = "none";
          el.appScreen.style.display = "block";
          await bootstrapDashboard();
        } catch (err) {
          showToast(`❌ 通信エラー: ${err.message}`);
        } finally {
          el.loginBtn.disabled = false;
        }
      }

      el.loginBtn.addEventListener("click", () => attemptLogin(el.passwordInput.value));
      el.passwordInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") attemptLogin(el.passwordInput.value);
      });

      el.logoutBtn.addEventListener("click", () => {
        sessionStorage.removeItem("holodori_admin_pw");
        location.reload();
      });

      el.fetchApiBtn.addEventListener("click", handleFetchNewApi);
      el.reloadAllBtn.addEventListener("click", bootstrapDashboard);

      el.eventSelect.addEventListener("change", (e) => {
        state.selectedKey = e.target.value;
        state.textManuallyEdited = false;
        recalculateAndRender();
      });

      el.nowBorderTextarea.addEventListener("input", () => {
        state.textManuallyEdited = true;
      });

      el.saveAdjBtn.addEventListener("click", () => submitCacheOrBroadcast(false));

      el.resetAdjBtn.addEventListener("click", () => {
        if (!state.selectedKey) return;
        state.manualAdjustments[state.selectedKey] = { "1000": 0, "5000": 0, "10000": 0 };
        recalculateAndRender();
        showToast("補正値を 0 にリセットしました");
      });

      el.copyTextBtn.addEventListener("click", () => {
        el.nowBorderTextarea.select();
        el.nowBorderTextarea.setSelectionRange(0, 99999);
        const copied = document.execCommand("copy");
        if (copied) {
          showToast("📋 テキストをクリップボードにコピーしました");
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(el.nowBorderTextarea.value)
            .then(() => showToast("📋 テキストをクリップボードにコピーしました"))
            .catch(() => showToast("⚠️ コピーに失敗しました"));
        }
      });

      el.downloadImgBtn.addEventListener("click", async () => {
        const { blob, filename } = await exportCanvasBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });

      el.updateCacheOnlyBtn.addEventListener("click", () => submitCacheOrBroadcast(false));
      el.broadcastBtn.addEventListener("click", () => submitCacheOrBroadcast(true));

      // セッション復元
      if (state.password) {
        attemptLogin(state.password).catch(() => {});
      }
    })();
  </script>
